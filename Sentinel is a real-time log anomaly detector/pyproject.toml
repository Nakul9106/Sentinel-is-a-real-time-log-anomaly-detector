[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-anomaly"
version = "0.1.0"
description = "Sentinel: Real-time Log Anomaly Detector"
readme = "README.md"
requires-python = ">=3.10" 
license = "MIT"
authors = [
    { name = "Sentinel DevOps & Security Team" }
]
dependencies = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "colorama>=0.4.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
sentinel = "sentinel.main:main"
sentinel-train = "sentinel.train:main"
sentinel-gen = "sentinel.generate_logs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
